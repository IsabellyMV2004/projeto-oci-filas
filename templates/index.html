
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filas OCI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Sistema de Filas OCI</h3>
            </div>

            <div class="card-body">

                <form id="formulario">

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="msg" class="form-label">
                            Mensagem
                        </label>

                        <textarea
                            class="form-control"
                            id="msg"
                            name="msg"
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <div class="d-flex flex-wrap gap-2">

                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="publicar('/publicar')"
                        >
                            Publicar
                        </button>

                        <button
                            type="button"
                            class="btn btn-success"
                            onclick="publicar('/publicarCanal')"
                        >
                            Publicar - Canal
                        </button>

                        <button
                            type="button"
                            class="btn btn-warning"
                            onclick="consumir('/consumir')"
                        >
                            Consumir
                        </button>

                        <button
                            type="button"
                            class="btn btn-info"
                            onclick="consumir('/consumirCanal')"
                        >
                            Consumir - Canal
                        </button>

                    </div>

                </form>

                <hr>

                <h5>Resultado:</h5>

                <pre
                    id="resultado"
                    class="bg-light border rounded p-3"
                >Aguardando operação...</pre>

            </div>

        </div>

    </div>

    <script>

        async function publicar(rota) {

            const formulario = document.getElementById("formulario");

            const dados = new FormData(formulario);

            const resultado = document.getElementById("resultado");

            try {

                const resposta = await fetch(rota, {
                    method: "POST",
                    body: dados
                });

                const retorno = await resposta.json();

                resultado.textContent = JSON.stringify(
                    retorno,
                    null,
                    2
                );

            } catch (erro) {

                resultado.textContent =
                    "Erro ao realizar a publicação: " + erro;

            }

        }


        async function consumir(rota) {

            const resultado = document.getElementById("resultado");

            try {

                const resposta = await fetch(rota, {
                    method: "POST"
                });

                const retorno = await resposta.json();

                resultado.textContent = JSON.stringify(
                    retorno,
                    null,
                    2
                );

            } catch (erro) {

                resultado.textContent =
                    "Erro ao consumir mensagens: " + erro;

            }

        }

    </script>

</body>

</html>
